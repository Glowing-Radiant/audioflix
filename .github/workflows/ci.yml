name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Check the changelog
        run: grep -q '^## \[Unreleased\]$' CHANGELOG.md || { echo "::error::CHANGELOG.md needs an ## [Unreleased] section"; exit 1; }
