name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug

      # A development build (AudioFlix Dev) to try a branch on a phone.
      - uses: actions/upload-artifact@v7
        with:
          name: audioflix-dev
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Check the changelog
        run: |
          grep -q '^## \[Unreleased\]$' CHANGELOG.md || { echo "::error::CHANGELOG.md needs an ## [Unreleased] section"; exit 1; }
